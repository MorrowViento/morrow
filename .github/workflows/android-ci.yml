name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (决策 D6)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 安装配方对齐 Glasmio 官方 CI：cmdline-tools 固定版本 + android-37.0 平台包名
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools
          log-accepted-android-sdk-licenses: true

      # 无需 NDK / CMake：Glasmio 的 AAR 已内置四 ABI 预编译 .so（libglasmio_liquid_menu_sdf.so），
      # 使用方不编译原生代码，NDK 仅供 Glasmio 自身构建使用。
      - name: Install SDK platform
        run: sdkmanager 'platforms;android-37.0'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      # M7：CDN 清单是更新检查的镜像源之一，写坏 JSON 会让客户端静默少一路候选
      - name: Validate update manifest
        run: python3 -c 'import json; d=json.load(open("update/manifest.json")); assert d["tag_name"] and isinstance(d["assets"], list)'

      - name: Build & check (assembleDebug + unit test + lint)
        run: gradle :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: morrow-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
